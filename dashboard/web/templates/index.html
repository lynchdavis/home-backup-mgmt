<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tourbillon Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>Tourbillon</h1>
    <p class="subtitle">saratoga → kodiak backup status — read-only, LAN-only</p>
  </header>

  <main>
    <section class="panel" id="status-panel"
             hx-get="/partials/status" hx-trigger="load, every 30s" hx-swap="innerHTML">
      <p class="loading">Loading…</p>
    </section>

    <section class="panel" id="hosts-panel"
             hx-get="/partials/hosts" hx-trigger="load, every 30s" hx-swap="innerHTML">
      <p class="loading">Loading…</p>
    </section>

    <section class="panel" id="repos-panel"
             hx-get="/partials/repos" hx-trigger="load, every 30s" hx-swap="innerHTML">
      <p class="loading">Loading…</p>
    </section>
  </main>
</body>
</html>
