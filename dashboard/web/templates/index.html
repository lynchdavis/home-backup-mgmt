{% extends "base.html" %}
{% block title %}Tourbillon — Status{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>Backup status</h1>
    <p class="subtitle">saratoga → kodiak — read-only, LAN-only</p>
  </header>

  <section class="panel" id="status-panel"
           hx-get="/partials/status" hx-trigger="load, every 30s" hx-swap="innerHTML">
    <p class="loading">Loading…</p>
  </section>

  <section class="panel" id="hosts-panel"
           hx-get="/partials/hosts" hx-trigger="load, every 30s" hx-swap="innerHTML">
    <p class="loading">Loading…</p>
  </section>

  <section class="panel" id="repos-panel"
           hx-get="/partials/repos" hx-trigger="load, every 30s" hx-swap="innerHTML">
    <p class="loading">Loading…</p>
  </section>
{% endblock %}
{% block scripts %}
  <script src="/static/htmx.min.js?v={{ ASSET_VERSION }}"></script>
{% endblock %}
