<h2>Host backups (A2)</h2>
{% if error %}
  <p class="error">{{ error }}</p>
{% elif not rows %}
  <p class="empty">no hosts configured</p>
{% else %}
  <table>
    <thead>
      <tr><th>Host</th><th>State</th><th>Last OK</th><th>Last seen</th><th>Size</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.name }}</td>
        <td><span class="badge {{ 'ok' if r.state == 'ok' else ('warn' if r.state in ('due', 'unreachable') else 'fail') }}">{{ r.state }}</span></td>
        <td>{{ r.last_success_at | iso_age }}</td>
        <td>{{ r.last_reachable_at | iso_age }}</td>
        <td>{{ r.size | bytes }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
