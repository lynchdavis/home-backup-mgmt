# server-backups (ADR-012): the backups-00 ZFS pool lives on an LVM logical
# volume on the RAID-10 (kodiak-datapool-00/backups-00), not on a raw disk.
# zfs-import-cache.service only waits for udev to settle, which doesn't
# guarantee LVM has activated the volume yet. Wait for its device node.
# Wants= (not Requires=): if the LV is ever missing, boot waits at most the
# device timeout and every other pool still imports.
[Unit]
Wants=dev-mapper-kodiak\x2d\x2ddatapool\x2d\x2d00\x2dbackups\x2d\x2d00.device
After=dev-mapper-kodiak\x2d\x2ddatapool\x2d\x2d00\x2dbackups\x2d\x2d00.device
